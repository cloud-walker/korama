name: Validate

on: workflow_call

jobs:
  check-types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
      - run: pnpm check-types

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
      - run: pnpm lint

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
      - run: pnpm build

  health:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
      - run: pnpm build
      # fallow's action installs the CLI with `npm install -g` and then runs
      # `fallow`; the pnpm-managed Node doesn't have npm's global bin on PATH.
      - run: echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
      - uses: fallow-rs/fallow@v3
        with:
          comment: true
          sarif: true
      # fallow's own SARIF upload is skipped on public repos (it checks for
      # GitHub Advanced Security, which only exists on private repos). Code
      # Scanning is free here, so upload the generated SARIF ourselves.
      - name: Upload fallow SARIF to code scanning
        if: ${{ always() && hashFiles('fallow-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: fallow-results.sarif

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
      - run: pnpm coverage
